name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Native / ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Configure and build C++23
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel 2
      - name: Native regression suite
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Locate reference executable
        shell: bash
        run: |
          if [ -f build/Release/synomizer.exe ]; then
            echo "SYNOMIZER_BIN=$GITHUB_WORKSPACE/build/Release/synomizer.exe" >> "$GITHUB_ENV"
          elif [ -f build/synomizer.exe ]; then
            echo "SYNOMIZER_BIN=$GITHUB_WORKSPACE/build/synomizer.exe" >> "$GITHUB_ENV"
          else
            echo "SYNOMIZER_BIN=$GITHUB_WORKSPACE/build/synomizer" >> "$GITHUB_ENV"
          fi
      - name: Browser/native parity, grammar guards and CLI tests
        run: npm test
      - name: Package executable with licence and usage
        shell: bash
        run: |
          mkdir -p distribution
          cp "$SYNOMIZER_BIN" distribution/
          cp LICENSE README.md CHANGELOG.md distribution/
      - uses: actions/upload-artifact@v4
        with:
          name: synomizer-${{ runner.os }}-${{ runner.arch }}
          path: distribution/
          if-no-files-found: error
          retention-days: 30

      - name: Build versioned installable ZIP package
        run: cpack --config build/CPackConfig.cmake -C Release -G ZIP -B packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}-${{ runner.arch }}
          path: packages/*.zip
          if-no-files-found: error
          retention-days: 30

  sanitizer:
    name: Address and undefined-behaviour sanitizers
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and test with sanitizers
        env:
          SYNOMIZER_BIN: ${{ github.workspace }}/build/synomizer
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          npm test

  browser:
    name: Browser / Chromium, Firefox, WebKit, mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Match package-lock.json. Browsers and Linux libraries are preinstalled,
    # avoiding runner-specific apt mirror lists and per-run system upgrades.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    env:
      PLAYWRIGHT_IMAGE_VERSION: "1.63.0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        timeout-minutes: 3
      - name: Verify browser image and test-package version match
        timeout-minutes: 1
        run: node -e "require('node:assert/strict').equal(require('./node_modules/@playwright/test/package.json').version, process.env.PLAYWRIGHT_IMAGE_VERSION)"
      - name: End-to-end editor tests under the Pages subpath
        timeout-minutes: 8
        run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report-and-screenshots
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Upload the exact site artifact accepted by all browser projects
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  pages:
    name: Deploy verified site
    timeout-minutes: 10
    needs: [native, sanitizer, browser]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed commit and every asset hash
        uses: actions/github-script@v7
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          script: |
            const crypto = require('node:crypto');
            const base = process.env.SITE_URL;
            const bust = '?verify=' + context.sha;
            let success = false;
            for (let attempt = 0; attempt < 12; attempt++) {
              try {
                const signal = AbortSignal.timeout(20000);
                const response = await fetch(new URL('build.json' + bust, base), { signal });
                if (!response.ok) throw new Error(`build.json: ${response.status}`);
                const build = await response.json();
                if (build.commit !== context.sha) throw new Error(`Deployment still serves ${build.commit}`);
                for (const [file, hash] of Object.entries(build.sha256)) {
                  const asset = await fetch(new URL(file + bust, base), { signal });
                  if (!asset.ok) throw new Error(`${file}: ${asset.status}`);
                  const actual = crypto.createHash('sha256').update(Buffer.from(await asset.arrayBuffer())).digest('hex');
                  if (actual !== hash) throw new Error(`${file}: hash mismatch`);
                }
                core.info(`Verified ${context.sha} and ${Object.keys(build.sha256).length} live assets.`);
                success = true;
                break;
              } catch (error) {
                core.info(error.message);
                await new Promise(resolve => setTimeout(resolve, 10000));
              }
            }
            if (!success) core.setFailed('Deployed site did not match the tested commit and asset hashes.');
